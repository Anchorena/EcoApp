name: EcoApp Fase B - regresiones

on:
  push:
    branches:
      - feature/wall-motion-multiview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check app.js
          node --check config.js
          node --check device-profiles.js
      - name: Ejecutar regresiones
        run: node --test tests/phase-a-regression.test.cjs
